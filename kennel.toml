[package]
name = "readersignal"
version = "0.3.0"
description = "Privacy-bounded audience measurement with durable recovery and exact-evidence checkpoints."
license = "MIT"
repository = "https://github.com/kujolang/readersignal"
documentation = "https://docs.kujolang.ai/tools/readersignal/"
readme = "README.md"

[package.status]
stage = "production"
stability = "stable"
public_api = true
notes = "POSIX local scope. Requires Kujo revision d501c2c46c51718ee10c4434f6cf9750bbd81453 or compatible newer filesystem APIs; version 1.5.0 alone is insufficient."

[kujo]
minimum_version = "1.5.0"
entry = "readersignal.kujo"
sources = ["readersignal.kujo", "src"]
includes = ["bin", "schemas", "fixtures", "docs", "scripts", "tests", "README.md", "CHANGELOG.md", "VERSION", "kujo.toml"]
excludes = [".git", ".tmp", ".readersignal", "node_modules", "output", "dist"]

[dependencies]

[dev-dependencies]
